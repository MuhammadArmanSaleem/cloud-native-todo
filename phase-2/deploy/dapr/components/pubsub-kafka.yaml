# Phase V – Dapr Pub/Sub component (Kafka/Redpanda)
# Apply to namespace where backend runs: kubectl apply -f deploy/dapr/components/ -n <namespace>
# For Redpanda Cloud: set brokers and auth in metadata (see Dapr docs)
apiVersion: dapr.io/v1alpha1
kind: Component
metadata:
  name: kafka-pubsub
  namespace: default
spec:
  type: pubsub.kafka
  version: v1
  metadata:
    - name: brokers
      value: "localhost:9092"
    - name: consumerGroup
      value: "todo-backend"
# Redpanda Cloud example (replace with your cluster):
#   metadata:
